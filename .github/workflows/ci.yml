# Checks every push and pull request as the pre-commit hook does. Pushes to
# main and v* tags also build every platform, all cross-compiled on x86-64
# Linux:
#   main   replaces the "nightly" pre-release, and deploys the web demo to
#          GitHub Pages
#   v*     makes that version's release (scripts/release.sh tags them)
#
# Secrets: only the Android jobs see any (the release keystore), through the
# "release" environment, which only main and v* tags may use. Actions are
# pinned to commits, and downloaded tools to checksums.

name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a branch makes an older run moot; a tag's run never is.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # Keeps build caches small; CI builds once.
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Check (${{ matrix.check }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The pre-commit hook's checks, side by side: one list, here and on
        # commit. deny and fmt are quick, so they share a job.
        check: [deny fmt, clippy-linux, clippy-windows, clippy-web, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        env:
          CHECK: ${{ matrix.check }}
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          case $CHECK in
            clippy-windows)
              rustup target add x86_64-pc-windows-gnu
              # The posix flavor: unrar's C++ uses std::thread.
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix
              sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
              sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
              ;;
            clippy-web) rustup target add wasm32-unknown-unknown ;;
            "deny fmt")
              curl -fsSL -o "$RUNNER_TEMP/deny.tar.gz" \
                https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
              echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $RUNNER_TEMP/deny.tar.gz" | sha256sum -c
              tar -xzf "$RUNNER_TEMP/deny.tar.gz" -C "$RUNNER_TEMP"
              sudo install "$RUNNER_TEMP"/cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny /usr/local/bin/
              ;;
          esac
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: matrix.check != 'deny fmt'
        with:
          key: ${{ matrix.check }}
      # cargo-deny looks at dependencies offline.
      - run: cargo fetch --locked
      - name: Run
        env:
          CHECK: ${{ matrix.check }}
        run: |
          for check in $CHECK; do
            .githooks/pre-commit "$check"
          done

  linux:
    name: Linux ${{ matrix.arch }}
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    # The oldest supported Ubuntu: its glibc (2.35) is what the binary needs.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For the About window's version (git describe).
          fetch-depth: 0
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.arch }}-unknown-linux-gnu
          if [ ${{ matrix.arch }} = aarch64 ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            {
              echo CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
              echo CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
              echo CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
              echo AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar
            } >> "$GITHUB_ENV"
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.arch }}
      - run: cargo build --release --locked --target ${{ matrix.arch }}-unknown-linux-gnu
      - run: scripts/package.sh linux-${{ matrix.arch }} "$(scripts/label.sh)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: target/dist/*
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-gnu
          - arch: aarch64
            target: aarch64-pc-windows-gnullvm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
          if [ ${{ matrix.arch }} = x86_64 ]; then
            # The posix flavor: unrar's C++ uses std::thread.
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          else
            curl -fsSL -o "$RUNNER_TEMP/llvm-mingw.tar.xz" \
              https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz
            echo "55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum -c
            mkdir "$RUNNER_TEMP/llvm-mingw"
            tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
            echo "$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_PATH"
            echo CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_LINKER=aarch64-w64-mingw32-clang >> "$GITHUB_ENV"
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      # Only Windows' own DLLs, and libunwind.dll, which the zip has.
      - name: Check the DLLs it needs
        run: |
          dlls=$(objdump -p target/${{ matrix.target }}/release/egui-files.exe | sed -n 's/.*DLL Name: //p' | tr 'A-Z' 'a-z' | sort -u)
          echo "$dlls"
          if echo "$dlls" | grep -E '^lib' | grep -vx libunwind.dll; then
            echo "::error::the .exe needs DLLs that Windows doesn't have"
            exit 1
          fi
      - run: scripts/package.sh windows-${{ matrix.arch }} "$(scripts/label.sh)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.arch }}
          path: target/dist/*
          if-no-files-found: error

  android:
    name: Android ${{ matrix.abi }}
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    # Holds the signing key; only main and v* tags may use it.
    environment: release
    strategy:
      matrix:
        include:
          - abi: arm64
            target: aarch64-linux-android
          - abi: x86_64
            target: x86_64-linux-android
    env:
      NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo install cargo-apk --version 0.10.0 --locked
      - name: Build and sign
        working-directory: android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$CARGO_APK_RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::error::the release environment has no ANDROID_KEYSTORE_BASE64 or ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          # Only for as long as the build takes, readable only by us.
          umask 077
          export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE" | base64 -d > "$CARGO_APK_RELEASE_KEYSTORE"
          status=0
          cargo apk build --release --target ${{ matrix.target }} || status=$?
          rm -f "$RUNNER_TEMP/release.keystore"
          exit $status
      - run: scripts/package.sh android-${{ matrix.abi }} "$(scripts/label.sh)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ matrix.abi }}
          path: target/dist/*
          if-no-files-found: error

  web:
    name: Web demo
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
          curl -fsSL -o "$RUNNER_TEMP/trunk.tar.gz" \
            https://github.com/trunk-rs/trunk/releases/download/v0.22.1/trunk-x86_64-unknown-linux-gnu.tar.gz
          echo "2ab8d548fd5ed9cda50906f61fd8654204e7893bd52ebbfd90533862b7d71ee1  $RUNNER_TEMP/trunk.tar.gz" | sha256sum -c
          sudo tar -xzf "$RUNNER_TEMP/trunk.tar.gz" -C /usr/local/bin trunk
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target/wasm"
      - run: web/build.sh target/site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/site

  pages:
    name: Deploy the web demo
    needs: [check, web]
    # Pages needs the repository to be public.
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  publish:
    name: Publish ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly' }}
    needs: [check, linux, windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The nightly's notes list the commits since the last one.
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          # Only the packages: not the web demo's Pages artifact.
          set -- dist/*.AppImage dist/*.tar.gz dist/*.zip dist/*.apk
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
            scripts/release-notes.sh "$version" > notes.md
            gh release create "$GITHUB_REF_NAME" "$@" --verify-tag \
              --title "egui-files $version" --notes-file notes.md
          else
            # Asked before it's deleted; there's none the first time.
            previous=$(gh release view nightly --json targetCommitish \
              --jq .targetCommitish || true)
            scripts/nightly-notes.sh "$previous" > notes.md
            gh release delete nightly --cleanup-tag --yes || true
            gh release create nightly "$@" --prerelease --target "$GITHUB_SHA" \
              --title "Nightly" --notes-file notes.md
          fi
