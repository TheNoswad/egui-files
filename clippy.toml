# What fails or panics in the web demo's browser, and what to use instead.
# Checked only in the wasm32 build (the crates allow these lints elsewhere):
# natively the replacements are these very items, re-exported.
disallowed-methods = [
    { path = "std::fs::canonicalize", replacement = "disk::canonicalize" },
    { path = "std::fs::copy", replacement = "disk::copy" },
    { path = "std::fs::create_dir", replacement = "disk::create_dir" },
    { path = "std::fs::create_dir_all", replacement = "disk::create_dir_all" },
    { path = "std::fs::exists", replacement = "disk::exists" },
    { path = "std::fs::hard_link", replacement = "disk::hard_link" },
    { path = "std::fs::metadata", replacement = "disk::metadata" },
    { path = "std::fs::read", replacement = "disk::read" },
    { path = "std::fs::read_dir", replacement = "disk::read_dir" },
    { path = "std::fs::read_link", replacement = "disk::read_link" },
    { path = "std::fs::read_to_string", replacement = "disk::read_to_string" },
    { path = "std::fs::remove_dir", replacement = "disk::remove_dir" },
    { path = "std::fs::remove_dir_all", replacement = "disk::remove_dir_all" },
    { path = "std::fs::remove_file", replacement = "disk::remove_file" },
    { path = "std::fs::rename", replacement = "disk::rename" },
    { path = "std::fs::set_permissions", replacement = "disk::set_permissions" },
    { path = "std::fs::symlink_metadata", replacement = "disk::symlink_metadata" },
    { path = "std::fs::write", replacement = "disk::write" },
    { path = "std::path::Path::canonicalize", replacement = "disk::canonicalize" },
    { path = "std::path::Path::exists", replacement = "disk::path_exists" },
    { path = "std::path::Path::try_exists", replacement = "disk::exists" },
    { path = "std::path::Path::is_dir", replacement = "disk::is_dir" },
    { path = "std::path::Path::is_file", replacement = "disk::is_file" },
    { path = "std::path::Path::is_symlink", replacement = "disk::is_symlink" },
    { path = "std::path::Path::metadata", replacement = "disk::metadata" },
    { path = "std::path::Path::read_dir", replacement = "disk::read_dir" },
    { path = "std::path::Path::read_link", replacement = "disk::read_link" },
    { path = "std::path::Path::symlink_metadata", replacement = "disk::symlink_metadata" },
    { path = "filetime::set_file_times", replacement = "disk::set_file_times" },
    { path = "filetime::set_file_mtime", replacement = "disk::set_file_mtime" },
    { path = "image::ImageReader::open", reason = "it opens the file with std; read it with disk" },
    { path = "std::time::SystemTime::now", reason = "panics in the browser; use web_time's" },
    { path = "std::thread::spawn", replacement = "crate::background::spawn" },
    { path = "std::process::id", replacement = "disk::process_id" },
]
disallowed-types = [
    { path = "std::fs::DirEntry", replacement = "disk::DirEntry" },
    { path = "std::fs::File", replacement = "disk::File" },
    { path = "std::fs::FileType", replacement = "disk::FileType" },
    { path = "std::fs::Metadata", replacement = "disk::Metadata" },
    { path = "std::fs::OpenOptions", replacement = "disk::OpenOptions" },
    { path = "std::fs::Permissions", replacement = "disk::Permissions" },
    { path = "std::fs::ReadDir", replacement = "disk::ReadDir" },
    { path = "std::time::Instant", replacement = "web_time::Instant" },
]
