[package]
name = "egui-files-android"
version = "0.1.0"
edition = "2024"
description = "egui-files for Android"
license = "MIT OR Apache-2.0"
publish = false

# Android loads the app as a shared library.
[lib]
crate-type = ["cdylib"]

[dependencies]
egui-files = { path = ".." }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
egui-winit = { version = "0.36", default-features = false }
log = "0.4"

[package.metadata.android]
package = "dev.egui_files"
apk_name = "egui-files"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 30
# 36 turns on predictive back, which stops sending the back key to apps
# that don't opt out, and cargo-apk can't write that opt-out.
target_sdk_version = 35

[package.metadata.android.application]
label = "egui-files"

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|keyboard|density|uiMode"
launch_mode = "singleTop"

# Browsing shared storage: "All files access", granted in the phone's settings.
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

# Keeps the screen on during a video export.
[[package.metadata.android.uses_permission]]
name = "android.permission.WAKE_LOCK"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29
