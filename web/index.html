<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>egui-files</title>
    <!-- Trunk builds the app's binary for wasm32 and loads it here. -->
    <link data-trunk rel="rust" href="../Cargo.toml" data-bin="egui-files" data-wasm-opt="z">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #1b1b1b;
        }
        /* eframe sizes the canvas to its parent. */
        #app {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="app"></canvas>
</body>
</html>
