[workspace]
# The Android library, which starts the app from `android_main`.
members = ["android", "android/trash", "disk"]

[package]
name = "egui-files"
version = "0.1.0"
edition = "2024"
description = "A tabbed file browser"
license = "MIT OR Apache-2.0"
# An app, and it builds with patched crates (see [patch.crates-io]).
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
directories = "6.0.0"
# Files and folders: std's, or in the browser kept in memory.
disk = { package = "egui-files-disk", path = "disk" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts"] }
egui = "0.36"
egui-phosphor = "0.14"
egui_dock = { version = "0.21", features = ["serde"] }
egui_extras = { version = "0.36", default-features = false }
md-5 = "0.10"
# `Instant` that works in the browser too (std's panics there); std's elsewhere.
web-time = "1.1"
notify = "8"
sha2 = "0.10"
kamadak-exif = "0.6"
object = { version = "0.39", default-features = false, features = ["read", "std"] }
percent-encoding = "2"
raw-window-handle = "0.6"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
serde = { version = "1.0.229", features = ["derive"] }
# What ffprobe says of a video.
serde_json = "1"
# Reading saved state before the window opens (eframe saves it as RON).
ron = "0.12"
# zstd is C, so only native builds have it (see the wasm32 section below).
zip = { version = "9.1.3", default-features = false, features = ["aes-crypto", "bzip2", "chrono", "deflate", "deflate64", "lzma", "ppmd", "time", "xz"] }
tar = "0.4.46"
flate2 = "1.1.10"
bzip2 = "0.6.1"
sevenz-rust2 = "0.24.1"
lzma-rust2 = "0.23"
two-face = { version = "0.5.2", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["parsing"] }
memchr = "2"
toml = "1"
fontdb = "0.24"
# SVG pictures: "Open with" icons, and images in markdown documents.
resvg = "0.49"
pulldown-cmark = { version = "0.13", default-features = false }
# Raw HTML in markdown documents (see src/markdown/html.rs).
html5gum = "0.9"
# Formulas and diagrams in markdown documents (see src/markdown/math.rs, diagram.rs).
katex-native = "0.1.1"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
emojis = "0.9.1"
ehttp = { version = "0.7.3", features = ["streaming"] }
skrifa = "0.44"

# Image decoding is painfully slow unoptimized; optimize dependencies even in dev builds.
# The web demo's build (see web/build.sh): every visitor downloads it, so it's
# built for size, and slowly.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

# The About window's list of crates comes from `cargo metadata`.
[build-dependencies]
serde_json = "1"
# The icon in the Windows .exe (build-support/egui-files.rc).
embed-resource = "3"

# Android has no trash the crate knows of; see android/trash.
[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
# Proton Drive (see src/remote/proton): an unofficial SDK, async on tokio. What
# keeps the user signed in goes in the OS's keyring.
proton-sdk = "0.11"
proton-drive-rs = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
keyring-core = "1"
zeroize = "1"
# Pictures pasted into markdown documents.
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
trash = "5.2.9"

# Everything a browser can't run: C libraries (wasm32-unknown-unknown has no
# libc to build them against), loading libraries, a terminal, and other apps.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "persistence", "wayland", "x11"] }
alacritty_terminal = { version = "0.26", default-features = false }
libloading = "0.8"
# Fallback fonts in memory without reading them.
memmap2 = "0.9"
open = "5.4.5"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
unrar = "0.5.8"
zip = { version = "9.1.3", default-features = false, features = ["zstd"] }
zstd = { version = "0.14", features = ["zstdmt"] }

# The web demo (see web/).
[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGL through glow: much smaller than wgpu, and nothing here needs more. No
# "persistence": a reload starts over.
eframe = { version = "0.36", default-features = false, features = ["glow"] }
# Oniguruma is C; fancy-regex is pure Rust (a few syntaxes go without).
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
# The clock from JavaScript's Date: std's panics in the browser.
chrono = { version = "0.4.45", default-features = false, features = ["wasmbind"] }
# The browser has the trash Android uses: plain files (see android/trash).
trash-android = { path = "android/trash" }
log = "0.4"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = [
    "Blob",
    "BlobPropertyBag",
    "CssStyleDeclaration",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "Document",
    "DragEvent",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FileSystemDirectoryEntry",
    "FileSystemDirectoryReader",
    "FileSystemEntry",
    "FileSystemFileEntry",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "Response",
    "Url",
    "Window",
    "XmlHttpRequest",
] }

[target.'cfg(target_os = "android")'.dependencies]
trash-android = { path = "android/trash" }
eframe = { version = "0.36", default-features = false, features = ["android-native-activity"] }
egui-winit = { version = "0.36", default-features = false }
jni = "0.22"
# Free space on storage volumes (statvfs).
libc = "0.2"
log = "0.4"

# Native Wayland drag and drop with other apps (winit doesn't implement it).
[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
# The terminal's PTY, wrapped to read what the shell says of itself; the
# version alacritty_terminal uses.
polling = "3.8"
smithay-client-toolkit = { version = "0.19", default-features = false }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
# Dragging files out to other apps on X11 (winit only receives drops).
x11rb = "0.13"
libc = "0.2"
# Headless OpenGL context for libmpv's renderer.
glow = "0.17"
# "Open with": file types, icon themes and SVG icons.
xdg-mime = "0.4"
freedesktop-icons = "0.4"
zbus = "6"

# "Open with" (file associations, app icons), drives and ejecting them.
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"
# OpenGL context for libmpv's renderer.
glow = "0.17"
windows = { version = "0.62", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# Crates with a fix of ours: each is one commit on top of its release, on a
# branch of a fork under github.com/TheNoswad; the commit's message says what
# and why. To move one to a new release, rebase its branch onto the new tag
# and update the rev here. Commits there name no upstream issues or people,
# as GitHub would link them back. scripts/upstream.sh watches for fixes
# upstream that would let one go.
[patch.crates-io]
# Branch egui-files/0.36.2: egui-winit shares one Wayland clipboard between
# windows (upstream drops a window's with it, which kills the Wayland
# connection), and passes Ctrl+V through when there's no text to paste.
# egui-winit depends on the rest of egui by path in its repository, so all
# of egui comes from the same commit.
ecolor = { git = "https://github.com/TheNoswad/egui", rev = "77c73f70b616f451af6f29ad38d852e3dacfbb04" }
eframe = { git = "https://github.com/TheNoswad/egui", rev = "77c73f70b616f451af6f29ad38d852e3dacfbb04" }
egui = { git = "https://github.com/TheNoswad/egui", rev = "77c73f70b616f451af6f29ad38d852e3dacfbb04" }
egui-wgpu = { git = "https://github.com/TheNoswad/egui", rev = "77c73f70b616f451af6f29ad38d852e3dacfbb04" }
egui-winit = { git = "https://github.com/TheNoswad/egui", rev = "77c73f70b616f451af6f29ad38d852e3dacfbb04" }
egui_extras = { git = "https://github.com/TheNoswad/egui", rev = "77c73f70b616f451af6f29ad38d852e3dacfbb04" }
egui_glow = { git = "https://github.com/TheNoswad/egui", rev = "77c73f70b616f451af6f29ad38d852e3dacfbb04" }
emath = { git = "https://github.com/TheNoswad/egui", rev = "77c73f70b616f451af6f29ad38d852e3dacfbb04" }
epaint = { git = "https://github.com/TheNoswad/egui", rev = "77c73f70b616f451af6f29ad38d852e3dacfbb04" }
epaint_default_fonts = { git = "https://github.com/TheNoswad/egui", rev = "77c73f70b616f451af6f29ad38d852e3dacfbb04" }
# Branch egui-files/0.5.8: builds for the target rather than the host (cross
# compiling to Windows and Android), and doesn't link GCC's CPU detection,
# which crashed the app on older x86 CPUs.
unrar_sys = { git = "https://github.com/TheNoswad/unrar.rs", rev = "49f724a7773aeef2b340e36c79b59c75d6ffa0bd" }
# Branch egui-files/0.3.1: works in the browser, leaves the user's cache
# alone, and measures text with the font diagrams are drawn with.
mermaid-rs-renderer = { git = "https://github.com/TheNoswad/mermaid-rs-renderer", rev = "c638a04b3d62966cab3fe6f5e20fd916ba6c166e" }
