[package]
name = "egui-files"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
directories = "6.0.0"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "persistence", "wayland", "x11"] }
egui = "0.36"
egui-phosphor = "0.14"
egui_dock = { version = "0.21", features = ["serde"] }
egui_extras = { version = "0.36", default-features = false }
libloading = "0.8"
md-5 = "0.10"
percent-encoding = "2"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
notify = "8"
open = "5.4.5"
serde = { version = "1.0.229", features = ["derive"] }
trash = "5.2.9"
zip = { version = "9.1.3", features = ["chrono"] }
tar = "0.4.46"
flate2 = "1.1.10"
zstd = { version = "0.14", features = ["zstdmt"] }
bzip2 = "0.6.1"
sevenz-rust2 = "0.24.1"
unrar = "0.5.8"
lzma-rust2 = "0.23"
filetime = "0.2"

# Image decoding is painfully slow unoptimized; optimize dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
ron = "0.12"

# Native Wayland drag and drop with other apps (winit doesn't implement it).
[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = { version = "0.19", default-features = false }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
raw-window-handle = "0.6"
libc = "0.2"
# Headless OpenGL context for libmpv's renderer.
glow = "0.17"
# "Open with": file types, icon themes and SVG icons.
xdg-mime = "0.4"
freedesktop-icons = "0.4"
resvg = "0.49"

# "Open with": the shell's file associations and app icons.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
