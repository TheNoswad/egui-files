[workspace]
# The Android library, which starts the app from `android_main`.
members = ["android", "android/trash", "disk"]

[package]
name = "egui-files"
version = "0.1.0"
edition = "2024"
description = "A tabbed file browser"
license = "MIT OR Apache-2.0"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
directories = "6.0.0"
# Files and folders: std's, or in the browser kept in memory.
disk = { package = "egui-files-disk", path = "disk" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts"] }
egui = "0.36"
egui-phosphor = "0.14"
egui_dock = { version = "0.21", features = ["serde"] }
egui_extras = { version = "0.36", default-features = false }
md-5 = "0.10"
# `Instant` that works in the browser too (std's panics there); std's elsewhere.
web-time = "1.1"
notify = "8"
sha2 = "0.10"
kamadak-exif = "0.6"
object = { version = "0.39", default-features = false, features = ["read", "std"] }
percent-encoding = "2"
raw-window-handle = "0.6"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
serde = { version = "1.0.229", features = ["derive"] }
# Reading saved state before the window opens (eframe saves it as RON).
ron = "0.12"
# zstd is C, so only native builds have it (see the wasm32 section below).
zip = { version = "9.1.3", default-features = false, features = ["aes-crypto", "bzip2", "chrono", "deflate", "deflate64", "lzma", "ppmd", "time", "xz"] }
tar = "0.4.46"
flate2 = "1.1.10"
bzip2 = "0.6.1"
sevenz-rust2 = "0.24.1"
lzma-rust2 = "0.23"
two-face = { version = "0.5.2", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["parsing"] }
memchr = "2"
toml = "1"
fontdb = "0.24"

# Image decoding is painfully slow unoptimized; optimize dependencies even in dev builds.
# The web demo's build (see web/build.sh): every visitor downloads it, so it's
# built for size, and slowly.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

# The About window's list of crates comes from `cargo metadata`.
[build-dependencies]
serde_json = "1"

# Android has no trash the crate knows of; see android/trash.
[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
trash = "5.2.9"

# Everything a browser can't run: C libraries (wasm32-unknown-unknown has no
# libc to build them against), loading libraries, a terminal, and other apps.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "persistence", "wayland", "x11"] }
alacritty_terminal = { version = "0.26", default-features = false }
libloading = "0.8"
open = "5.4.5"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
unrar = "0.5.8"
zip = { version = "9.1.3", default-features = false, features = ["zstd"] }
zstd = { version = "0.14", features = ["zstdmt"] }

# The web demo (see web/).
[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGL through glow: much smaller than wgpu, and nothing here needs more. No
# "persistence": a reload starts over.
eframe = { version = "0.36", default-features = false, features = ["glow"] }
# Oniguruma is C; fancy-regex is pure Rust (a few syntaxes go without).
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
# The clock from JavaScript's Date: std's panics in the browser.
chrono = { version = "0.4.45", default-features = false, features = ["wasmbind"] }
# The browser has the trash Android uses: plain files (see android/trash).
trash-android = { path = "android/trash" }
log = "0.4"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = [
    "Blob",
    "BlobPropertyBag",
    "CssStyleDeclaration",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "Document",
    "DragEvent",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FileSystemDirectoryEntry",
    "FileSystemDirectoryReader",
    "FileSystemEntry",
    "FileSystemFileEntry",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "Url",
    "Window",
    "XmlHttpRequest",
] }

[target.'cfg(target_os = "android")'.dependencies]
trash-android = { path = "android/trash" }
eframe = { version = "0.36", default-features = false, features = ["android-native-activity"] }
egui-winit = { version = "0.36", default-features = false }
jni = "0.22"
# Free space on storage volumes (statvfs).
libc = "0.2"
log = "0.4"

# Native Wayland drag and drop with other apps (winit doesn't implement it).
[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = { version = "0.19", default-features = false }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
# Dragging files out to other apps on X11 (winit only receives drops).
x11rb = "0.13"
libc = "0.2"
# Headless OpenGL context for libmpv's renderer.
glow = "0.17"
# "Open with": file types, icon themes and SVG icons.
xdg-mime = "0.4"
freedesktop-icons = "0.4"
resvg = "0.49"
zbus = "6"

# "Open with" (file associations, app icons), drives and ejecting them.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# unrar_sys 0.5.8's build script checks the host OS instead of the target, which
# breaks cross-compiling to Windows; patches/unrar_sys fixes only build.rs.
[patch.crates-io]
unrar_sys = { path = "patches/unrar_sys" }
# Shares one Wayland clipboard between windows: upstream drops a window's
# with it, which kills the Wayland connection (see patches/README.md).
egui-winit = { path = "patches/egui-winit" }
